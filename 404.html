<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1f33">
  <title>EI ERP Nova V9</title>
  <link rel="icon" href="./assets/img/app-icon.svg">
  <link rel="stylesheet" href="./assets/css/app.css?v=9.0.0">
</head>
<body>
  <div id="boot-screen" class="boot-screen">
    <img src="./assets/img/logo.jpeg" alt="Electroingeniería" class="boot-logo">
    <div class="spinner" aria-hidden="true"></div>
    <p>Iniciando ERP Supabase Native…</p>
  </div>

  <main id="auth-view" class="auth-view hidden">
    <section class="auth-card">
      <div class="brand-block">
        <img src="./assets/img/logo.jpeg" alt="Electroingeniería" class="brand-logo">
        <div>
          <p class="eyebrow">Electroingeniería</p>
          <h1>EI ERP Nova V9</h1>
          <p>Supabase Native + Google Drive</p>
        </div>
      </div>
      <form id="login-form" class="form-stack" novalidate>
        <label>Correo corporativo
          <input id="login-email" type="email" autocomplete="username" required placeholder="usuario@ei.com.co">
        </label>
        <label>Contraseña
          <input id="login-password" type="password" autocomplete="current-password" required>
        </label>
        <button class="btn btn-primary btn-lg" type="submit">Ingresar</button>
        <p id="login-error" class="form-error" role="alert"></p>
      </form>
    </section>
  </main>

  <div id="app-view" class="app-view hidden">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="./assets/img/app-icon.svg" alt="" class="sidebar-icon">
        <div><strong>EI ERP Nova</strong><span>V9 · Supabase Native</span></div>
      </div>
      <nav id="main-nav" class="main-nav" aria-label="Módulos ERP"></nav>
      <div class="sidebar-footer">
        <div id="user-card" class="user-card"></div>
        <button id="logout-btn" class="btn btn-ghost btn-full" type="button">Cerrar sesión</button>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <button id="menu-btn" class="icon-btn mobile-only" type="button" aria-label="Abrir menú">☰</button>
        <div>
          <p id="page-kicker" class="eyebrow">ERP</p>
          <h2 id="page-title">Inicio</h2>
        </div>
        <div class="topbar-actions">
          <button id="refresh-btn" class="btn btn-secondary" type="button">Actualizar</button>
          <button id="drive-btn" class="btn btn-secondary" type="button">Conectar Drive</button>
        </div>
      </header>
      <section id="page-content" class="page-content" aria-live="polite"></section>
    </section>
  </div>

  <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>
  <aside id="case-drawer" class="case-drawer hidden" aria-label="Detalle del pedido"></aside>

  <div id="modal-backdrop" class="modal-backdrop hidden"></div>
  <section id="modal" class="modal hidden" role="dialog" aria-modal="true"></section>

  <div id="toast-region" class="toast-region" aria-live="assertive"></div>

  <script type="module" src="./assets/js/app.js?v=9.0.0"></script>
</body>
</html>
